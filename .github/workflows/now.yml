# Refreshes the "Now building" section from the private homelab change log.
# Secret NOW_TOKEN: fine-grained token, ONLY repo homelab-copilot-node, Contents: Read-only, expires in 1 year.
# Runs on a schedule or by hand only (never on pull requests), so the secret is never exposed to forks.
name: Update Now building
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: now-building
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node --test scripts/update-now.test.mjs
      - run: node scripts/update-now.mjs
        env:
          NOW_TOKEN: ${{ secrets.NOW_TOKEN }}
      - name: Commit if changed
        run: |
          git diff --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'Update Now building'
          git push
